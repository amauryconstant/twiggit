# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GitHub Actions release config. Self-contained: identical build/archive/
# sbom/changelog blocks are also duplicated in .goreleaser.yml. Drift
# between the two is a known cost of the override-file pattern; v2.18.2
# OSS has no `includes:` (Pro-only). Keep both files in sync.

project_name: twiggit
version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

snapshot:
  version_template: "{{ incpatch .Version }}-next"

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

builds:
  - id: twiggit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X twiggit/internal/version.Version={{.Version}}
      - -X twiggit/internal/version.Commit={{.Commit}}
      - -X twiggit/internal/version.Date={{.Date}}
    main: ./main.go
    binary: twiggit
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE*
      - README.md
      - AGENTS.md

checksum:
  name_template: 'twiggit_{{.Version}}_checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_sbom.spdx.json"

# Sign the checksums file with cosign keyless (OIDC). Goreleaser invokes
# cosign as a child process; the CI runner's ambient OIDC tokens (GitLab
# SIGSTORE_ID_TOKEN, GitHub ACTIONS_ID_TOKEN_REQUEST_TOKEN) flow through.
# cosign v3 writes a single .sigstore.json bundle (signature + cert +
# Rekor inclusion) per artifact. Bundles land in dist/ for debugging but
# are NOT published as release assets. Per-SBOM signing is intentionally
# omitted: SBOMs are transitively protected by the checksum file.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - '^Merge pull request'
      - '^Merge branch'
  groups:
    - title: Features
      order: 0
    - title: Bug Fixes
      order: 100
    - title: Other
      order: 999

# Override the base .goreleaser.yml force_token: gitlab so the GitHub
# Actions release job uses only GITHUB_TOKEN for SCM publishing.
force_token: github

release:
  github:
    owner: amauryconstant
    name: twiggit
  mode: replace
  replace_existing_artifacts: false
  name_template: "v{{ .Version }}"

gomod:
  proxy: false
