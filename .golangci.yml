# $schema: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25.5"
  build-tags:
    - e2e
    - integration

linters:
  default: none
  enable:
    # Essential
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Code quality
    - gocyclo
    - funlen

    # Style
    - misspell
    - whitespace
    - revive

    # Error handling
    - errorlint
    - wrapcheck
    - errname

    # Performance
    - prealloc
    - perfsprint

    # Security
    - gosec
    - depguard

    # Tests
    - testifylint
    - tparallel
    - thelper

    # Best practices
    - nakedret
    - unconvert
    - unparam
    - wastedassign

    # Modernization
    - modernize

  # gocognit intentionally absent (redundant with gocyclo + nestif).

  settings:
    staticcheck:
      checks: ["all,-ST1000"]  # all but style-only checks already covered by revive

    testifylint:
      enable-all: true
      bool-compare:
        ignore-custom-types: false
      expected-actual:
        pattern: "^(expected|want|exp|expectedResult|wantResult)"
      formatter:
        check-format-string: true
        require-f-funcs: false
        require-string-msg: true
      go-require:
        ignore-http-handlers: true
      require-error:
        fn-pattern: "^(Errorf?|NoErrorf?)$"
      suite-extra-assert-call:
        mode: "remove"

    funlen:
      lines: 150
      statements: 100

    gocyclo:
      min-complexity: 25

    errcheck:
      check-type-assertions: true

    nolintlint:
      require-explanation: true
      require-specific: true

    depguard:
      # Tier 2 strict rules per cli-functional-core-shell proposal §Lint.
      # Each layer lists the imports it legitimately needs. The deny
      # blocks document WHY a layer cannot reach into others, so future
      # contributors see the constraint without re-reading the proposal.
      rules:
        core:
          files:
            - "**/internal/core/**"
          allow:
            - $gostd
            - github.com/samber/lo
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "core MUST stay pure; no styling in core"
            - pkg: "github.com/charmbracelet/lipgloss/v2"
              desc: "core MUST stay pure; no styling in core"
            - pkg: "github.com/go-git/go-git/v5"
              desc: "core is pure; no git library"
            - pkg: "github.com/knadh/koanf/v2"
              desc: "core is pure; no config library"
            - pkg: "twiggit/internal/git"
              desc: "core MUST NOT depend on git adapter"
            - pkg: "twiggit/internal/config"
              desc: "core MUST NOT depend on config adapter"
            - pkg: "twiggit/internal/output"
              desc: "core MUST NOT depend on output package"
            - pkg: "twiggit/internal/iostreams"
              desc: "core MUST NOT depend on iostreams"
            - pkg: "twiggit/cmd"
              desc: "core MUST NOT depend on cmd layer"

        git:
          files:
            - "**/internal/git/**"
          allow:
            - $gostd
            - github.com/samber/lo
            - github.com/go-git/go-git/v5
            - github.com/hashicorp/golang-lru/v2
            - github.com/knadh/koanf/v2
            - github.com/knadh/koanf/parsers/toml
            - github.com/knadh/koanf/providers/file
            - github.com/stretchr/testify
            - twiggit/internal/core
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "git adapter MUST NOT pull lipgloss"
            - pkg: "github.com/charmbracelet/lipgloss/v2"
              desc: "git adapter MUST NOT pull lipgloss"
            - pkg: "twiggit/internal/iostreams"
              desc: "git adapter MUST NOT depend on iostreams"
            - pkg: "twiggit/internal/output"
              desc: "git adapter MUST NOT depend on output"
            - pkg: "twiggit/internal/cmdutil"
              desc: "git adapter MUST NOT depend on cmdutil"
            - pkg: "twiggit/cmd"
              desc: "git adapter MUST NOT depend on cmd"

        config:
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/samber/lo
            - github.com/knadh/koanf/v2
            - github.com/knadh/koanf/parsers/toml
            - twiggit/internal/core
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "config MUST NOT pull lipgloss"
            - pkg: "github.com/charmbracelet/lipgloss/v2"
              desc: "config MUST NOT pull lipgloss"
            - pkg: "github.com/go-git/go-git/v5"
              desc: "config MUST NOT depend on git library"
            - pkg: "twiggit/cmd"
              desc: "config MUST NOT depend on cmd"

        output:
          files:
            - "**/internal/output/**"
          allow:
            - $gostd
            - github.com/samber/lo
            - charm.land/lipgloss/v2
            - twiggit/internal/core
            - twiggit/internal/iostreams
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "output uses charm.land/lipgloss/v2 (new path); v1 forbidden"
            - pkg: "twiggit/internal/git"
              desc: "output MUST NOT depend on git adapter"
            - pkg: "twiggit/internal/cmdutil"
              desc: "output MUST NOT depend on cmdutil"
            - pkg: "twiggit/cmd"
              desc: "output MUST NOT depend on cmd"

        iostreams:
          files:
            - "**/internal/iostreams/**"
          allow:
            - $gostd
            - github.com/samber/lo
            - charm.land/lipgloss/v2
            - github.com/charmbracelet/x/term
            - golang.org/x/term
            - twiggit/internal/core
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "iostreams uses charm.land/lipgloss/v2 (new path); v1 forbidden"
            - pkg: "twiggit/internal/git"
              desc: "iostreams MUST NOT depend on git adapter"
            - pkg: "twiggit/internal/output"
              desc: "iostreams MUST NOT depend on output"
            - pkg: "twiggit/internal/cmdutil"
              desc: "iostreams MUST NOT depend on cmdutil"
            - pkg: "twiggit/cmd"
              desc: "iostreams MUST NOT depend on cmd"

        cmdutil:
          files:
            - "**/internal/cmdutil/**"
          allow:
            - $gostd
            - github.com/samber/lo
            - github.com/spf13/cobra
            - twiggit/internal/core
            - twiggit/internal/iostreams
            - twiggit/internal/output
            - twiggit/internal/git
            - twiggit/internal/config
            - twiggit/internal/version
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "cmdutil does not render; let iostreams/output own styling"
            - pkg: "github.com/charmbracelet/lipgloss/v2"
              desc: "cmdutil does not render; let iostreams/output own styling"
            - pkg: "twiggit/cmd"
              desc: "cmdutil MUST NOT depend on cmd"

        version:
          files:
            - "**/internal/version/**"
          allow:
            - $gostd

        cmd:
          files:
            - cmd/**
          allow:
            - $gostd
            - github.com/samber/lo
            - github.com/spf13/cobra
            - github.com/carapace-sh/carapace
            - github.com/stretchr/testify
            - twiggit/internal/core
            - twiggit/internal/iostreams
            - twiggit/internal/output
            - twiggit/internal/cmdutil
            - twiggit/internal/git
            - twiggit/internal/config
            - twiggit/internal/version
            - twiggit/cmd
          deny:
            - pkg: "github.com/charmbracelet/lipgloss"
              desc: "cmd/ uses charm.land/lipgloss/v2 through internal/{iostreams,output} only"
            - pkg: "github.com/charmbracelet/lipgloss/v2"
              desc: "cmd/ uses lipgloss via internal/{iostreams,output} only"

  exclusions:
    rules:
      # Broad test exclusions (fixtures, helpers, mocks, integration, e2e, etc.)
      - path: ".*_test\\.go|test/(fixtures|helpers|mocks|integration)/.*\\.go|test/e2e/(fixtures|helpers)/.*\\.go"
        linters:
          - funlen
          - gocyclo
          - gosec
          - unparam
          - wastedassign
          - wrapcheck
          - errcheck
          - prealloc
          - revive
          - depguard
