# $schema: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25.5"
  build-tags:
    - e2e
    - integration

linters:
  default: none
  enable:
    # Essential
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Code quality
    - gocyclo
    - funlen

    # Style
    - misspell
    - whitespace
    - revive

    # Error handling
    - errorlint
    - wrapcheck
    - errname

    # Performance
    - prealloc
    - perfsprint

    # Security
    - gosec
    - depguard

    # Tests
    - testifylint
    - tparallel
    - thelper

    # Best practices
    - nakedret
    - unconvert
    - unparam
    - wastedassign

    # Modernization
    - modernize

  settings:
    staticcheck:
      checks: ["all,-ST1000"]  # all but style-only checks already covered by revive

    testifylint:
      enable-all: true
      bool-compare:
        ignore-custom-types: false
      expected-actual:
        pattern: "^(expected|want|exp|expectedResult|wantResult)"
      formatter:
        check-format-string: true
        require-f-funcs: false
        require-string-msg: true
      go-require:
        ignore-http-handlers: true
      require-error:
        fn-pattern: "^(Errorf?|NoErrorf?)$"
      suite-extra-assert-call:
        mode: "remove"

    funlen:
      lines: 150
      statements: 100

    gocyclo:
      min-complexity: 25

    errcheck:
      check-type-assertions: true

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: []
      allow-specific: []

    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - internal/domain

        service:
          files:
            - internal/service/**
          allow:
            - $gostd
            - internal/domain
            - internal/application
            - internal/service
          deny:
            - pkg: "twiggit/internal/infrastructure"
              desc: "service layer MUST NOT depend on infrastructure"
            - pkg: "twiggit/cmd"
              desc: "service layer MUST NOT depend on cmd"

        application:
          files:
            - internal/application/**
          allow:
            - $gostd
            - internal/domain
            - internal/application
          deny:
            - pkg: "twiggit/internal/infrastructure"
              desc: "application layer MUST NOT depend on infrastructure"
            - pkg: "twiggit/internal/service"
              desc: "application layer MUST NOT depend on service"
            - pkg: "twiggit/cmd"
              desc: "application layer MUST NOT depend on cmd"

        infrastructure:
          files:
            - internal/infrastructure/**
          allow:
            - $gostd
            - internal/domain
            - internal/application
            - internal/infrastructure
          deny:
            - pkg: "twiggit/internal/service"
              desc: "infrastructure MUST NOT depend on service"
            - pkg: "twiggit/cmd"
              desc: "infrastructure MUST NOT depend on cmd"

        cmd:
          files:
            - cmd/**
          allow:
            - $gostd
            - internal/domain
            - internal/application
            - internal/service
            - internal/infrastructure
            - internal/version
            - twiggit/cmd

        mocks:
          files:
            - test/mocks/**
          allow:
            - $gostd
            - internal/domain
            - internal/application
            - internal/service
            - internal/infrastructure

  exclusions:
    rules:
      # Broad test exclusions (fixtures, helpers, mocks, integration, e2e, etc.)
      - path: ".*_test\\.go|test/(fixtures|helpers|mocks|integration)/.*\\.go|test/e2e/(fixtures|helpers)/.*\\.go"
        linters:
          - funlen
          - gocyclo
          - gosec
          - unparam
          - wastedassign
          - wrapcheck
          - errcheck
          - prealloc
          - revive
          - depguard

      # Generated files
      - path: ".*_gen\\.go"
        linters: [all]

      # Main file
      - path: "main\\.go"
        linters: [gosec]

      # Specific noisy patterns
      - linters: [unparam]
        text: "parameter 'cmd' seems to be unused"
      - linters: [unparam]
        text: "parameter 'm' seems to be unused"
      - linters: [revive]
        text: "type name will be used as"
      - linters: [revive]
        text: "should have a package comment"

      # Godoc on every exported symbol: deferred (pre-existing
      # tech debt; tracked by quality-modernization)
      - linters: [revive]
        text: "exported type .* should have comment"
      - linters: [revive]
        text: "exported function .* should have comment"
      - linters: [revive]
        text: "exported method .* should have comment"
      - linters: [revive]
        text: "comment on exported method"

      # Modernize findings in pre-existing code (deferred to
      # quality-modernization; this change enabled the linter
      # but does not absorb the cleanup work)
      - linters: [modernize]
        path: "cmd/.*"
      - linters: [modernize]
        path: "test/e2e/.*"
      - linters: [modernize]
        path: "test/helpers/.*"
      - linters: [modernize]
        path: "internal/infrastructure/shell_infra\\.go"
      # cli_client.go deferred CutPrefix sites (quality-modernization
      # task 11.2 owns these specific lines per coordination memo)
      - linters: [modernize]
        path: "internal/infrastructure/cli_client\\.go"
        text: "stringscutprefix"
      - linters: [modernize]
        path: "internal/infrastructure/cli_client\\.go"
        text: "stringsseq"

      # Pre-existing modernize findings in code this change did
      # not touch (SuggestionOption is pre-existing API; deferred
      # to quality-modernization for breakage analysis)
      - linters: [modernize]
        path: "internal/domain/context\\.go"
      - linters: [modernize]
        path: "internal/infrastructure/context_resolver\\.go"
        text: "any:"
      - linters: [modernize]
        path: "internal/infrastructure/context_detector_test\\.go"
      - linters: [modernize]
        path: "main_test\\.go"
      - linters: [modernize]
        path: "test/integration/git_clients_test\\.go"
        text: "plusbuild"
      - linters: [modernize]
        path: "test/integration/git_routing_test\\.go"
        text: "plusbuild"
      - linters: [modernize]
        path: "test/integration/path_utilities_test\\.go"
        text: "plusbuild"
      - linters: [modernize]
        path: "test/integration/project_discovery_test\\.go"
        text: "plusbuild"

      # Pre-existing unparam: hook_runner.executeCommands always
      # returns nil error (pre-existing signature; needs contract
      # review before changing)
      - linters: [unparam]
        path: "internal/infrastructure/hook_runner\\.go"
