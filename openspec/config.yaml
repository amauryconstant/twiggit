schema: spec-driven

context: |
  Domain: Pragmatic git worktree management tool with context-aware
  operations optimized for rebase workflows across multiple projects.

  Architecture (golang-cli Tier 2, "functional-core, imperative-shell"):
  - cmd/                    → Presentation (Cobra commands; thin runF)
  - internal/cmdutil/       → Composition root helper: Factory (functional
                              options), ExitCodeFor, persistent flags, signal
                              handling, HookRunner consumer interface
  - internal/core/          → Pure functional core: value objects, errors,
                              validation, path utils, shell types, hook types.
                              No I/O. Imports stdlib + samber/lo.
  - internal/git/           → I/O adapter: client, reader, writer, hook
                              runner, context_detector, context_resolver,
                              repo_finder, shell_detect, command_executor,
                              errors
  - internal/config/        → koanf-backed config manager + XDG resolution
  - internal/output/        → Formatter registry, error renderer, table
                              writer, shell wrapper (ComposeWrapper)
  - internal/iostreams/     → IOStreams struct, lipgloss styles, slog logger
                              singleton
  - internal/version/       → Build-time version injection
  - main.go                 → Composition root: Factory init, signal context,
                              panic recover, cobra dispatch, exit-code mapping

  Dependency Flow:
    main.go → cmd → internal/{cmdutil,git,config,output,iostreams} → internal/core
                                          ↓
                                    internal/version

  Key Architectural Patterns:
  - Functional-core, imperative-shell: internal/core/ has zero I/O; everything
    that touches the filesystem, network, or shell lives in adapter packages.
  - Role-based interface segregation (core-git): interfaces defined
    consumer-side in internal/core; the composite *git.Client satisfies all
    six roles via embedded promotion. Drift sentinel enforces method-set
    invariants.
  - Constructor injection with interfaces; Factory is the only place where
    infrastructure is instantiated (lazy function fields via sync.OnceValue).
  - Context-aware operations: context_detector + context_resolver.
  - Error wrapping: adapter code in internal/git/ returns wrapped errors only;
    logging happens at the cmd boundary (single-handling rule). See
    golang-error-handling.

  Context Types (internal/core):
  - ContextProject: Inside a project's main repository
  - ContextWorktree: Inside a worktree (subdirectory under Worktrees/)
  - ContextOutsideGit: Not in any git repository
  - Detection priority: worktree folder > project folder > outside git

  Default Paths:
  - Projects: $HOME/Projects/<project>/
  - Worktrees: $HOME/Worktrees/<project>/<branch>/

  Tech stack: Go 1.27.1, Cobra, go-git, Koanf, Testify, Ginkgo/Gomega,
              Carapace, charm.land/lipgloss/v2, go.uber.org/goleak,
              hashicorp/golang-lru/v2, golang.org/x/term, samber/lo
  Tooling: mise, golangci-lint v2.14.0, goreleaser v2.18.2, govulncheck,
           gopls, ginkgo, gocover-cobertura, gocovmerge, cosign, syft,
           pre-commit. golangci-lint run enforces gofumpt + goimports.

  Code conventions:
  - NO comments in code unless explicitly requested (project preference)
  - Tests written AFTER implementation to anchor behavior and specs
  - Table-driven tests with fixtures
  - Constructor injection with interfaces
  - ValidationError returned directly (NOT wrapped); other errors wrapped
    with core.ValidationError / core.NotFoundError / core.OperationError
    / core.UsageError, or git.New*Error for adapter failures
  - Use errors.Is() and errors.As() / errors.AsType[T] for chain
    inspection, never string matching
  - Single-handling rule: errors are EITHER logged OR returned, never both
  - Logger singleton: iostreams.NewLogger(io.Writer) is the one *slog.Logger
    shared by IOStreams.Logger, Factory.Logger, slog.Default()
  - All exported types, functions, methods MUST have doc comments (Go
    ecosystem norm); package comment MUST exist

  Exit Codes (canonical 3-code contract):
  - 0 success
  - 1 failure (any non-usage error, including ValidationError and
    NotFoundError)
  - 2 UsageError (bad flag, argument, missing input)
  - 130 SIGINT / SIGTERM bypass ExitCodeFor

  Testing approach:
  - Unit tests (Testify) in internal/ with mocks; suite.Run pattern with
    AssertExpectations(t)
  - Integration tests (Testify) in test/integration/ with real git repos
  - E2E tests (Ginkgo/Gomega) in test/e2e/ with built binary
  - cmd/ covered by unit tests under `cmd/*_test.go` and by `test/e2e/`
  - Race detector: go test -race ./...
  - Module drift gate: go mod tidy && git diff --exit-code
  - Golden-file tests: test/golden/ with UPDATE_GOLDEN toggle
  - Concurrent suite: test/concurrent/ with goleak for goroutine leak
    detection

  Development workflow:
  - Use mise run <task> for all operations
  - Run mise run verify before committing (format + lint:fix + lint:gated +
    vuln:check + test + build)
  - Pre-commit hooks: whitespace, EOF/YAML/TOML/JSON validation, merge
    conflict detection, gofmt, govet, golangci-lint, govulncheck

  Spec organization (project-specific):
  - Layout: openspec/specs/<category>-<spec-name>/spec.md. Specs live one folder
    deep under openspec/specs/. Files directly at openspec/specs/ are not
    permitted.
  - Naming convention: lowercase, hyphen-separated, always prefixed with a
    category. Pick the shortest unambiguous category; only invent a new prefix
    if none fit.
  - Canonical category prefixes (4):
    - `cli-` — command-line interface layer (alignment: cmd/,
      internal/cmdutil/, internal/iostreams/). Examples: cobra framework
      setup, exit codes, output formats, shell completion, error
      formatting, command surface, flag conventions, help examples,
      factory wiring.
    - `core-` — pure functional core (alignment: internal/core/).
      Examples: typed-error taxonomy, context types, config knob types,
      hook types, role-interface segregation, value objects, service
      requests/results, validation pipeline, shell types, git types,
      service-error constructors.
    - `git-` — git I/O adapter + config (alignment: internal/git/,
      internal/config/). Examples: git client routing, context resolver,
      hook runner, shell-detect, config loading, command executor,
      repo finder.
    - `testing-` — test infrastructure (alignment: test/). Examples: e2e
      suite, helpers, golden files, fixtures, conventions.
    - Cross-package: `output-progress` (cmd/suggestions.go) and
      `version-package` (internal/version/) live under `cli-` and `core-`
      respectively; both names retain their descriptive suffix.
  - Cross-spec references SHALL use bare directory names (e.g., `cli-prune`),
    never line-anchored paths (e.g., `cli-prune/spec.md:35`).

  Canonical spec ownership (consult before adding content; cross-reference the
  owner instead of restating):
  - `core-errors` owns the four `core.Error` subtypes (ValidationError,
    NotFoundError, OperationError, UsageError), their constructors, and
    the `Error()`/`Unwrap()` contracts.
  - `cli-error-formatting` owns the cmd-side error-to-exit-code dispatch
    (`ExitCodeFor`), formatter registration order, and the canonical
    exit-code mapping table. Consumer specs use the symbolic exit-code
    names.
  - `git-context-resolver` owns the context-detection priority chain
    (worktree > project > outside git) and identifier resolution.
  - `git-client` owns the GoGit/CLI composite routing decision and the
    worktree-lifecycle surface (CreateWorktree, DeleteWorktree,
    PruneWorktrees). Read-side method sets split by role per `core-git`.
  - `core-git` owns the role-interface segregation (RepositoryOpener,
    BranchReader, RepositoryReader, RemoteReader, WorktreeWriter,
    BranchWriter) and the drift sentinel that enforces method-set
    invariants.
  - `cli-init` owns the init command surface (positional shell arg,
    `--install`, `--force`; shell type selected via `--shell=<type>`).
  - `git-config` owns the full configuration knob surface and the
    koanf-backed load path (defaults → file → env → flags).
  - `cli-prune`, `cli-delete`, `cli-create`, `cli-list` collectively own
    the per-command worktree-mutation safety contracts (concurrency, dirty
    checks, current-worktree refusal, merged check, branch deletion).

rules:
  proposal:
    - "Typically include: Why, What Changes, Capabilities, Impact"
    - Focus on user value and problem statement first
    - Include "Non-goals" section to constrain scope
    - List all affected files organized by layer (cmd, service, domain, infrastructure)
    - Document breaking changes explicitly when applicable
    - Keep proposals concise and actionable
    # Discipline (added)
    - Impact MUST list affected files grouped by layer AND by role (production, tests, docs, CI, e2e golden)
    - Include Risk-and-mitigation entries for significant changes within Impact
    # Machine-readable (added; matches airk's bracketed convention)
    - "[breaking-change-flag] Each user-visible break SHALL be prefixed **BREAKING** with a Migration note in the same bullet; non-breaking changes SHALL NOT carry the prefix"
    - "[capability-owner-cross-ref] When a proposal declares a Modified Capability, it SHALL cross-reference the owning spec by bare name (e.g., `cli-output`) without restating that spec's content"
    # Co-location (added)
    - "[tests-with-impl] Proposal SHALL group tests, docs, and CI changes alongside the implementation task they verify; the late-cascade anti-pattern (deferred test/doc groups) is prohibited"

  specs:
    # Purity principles — reader-extractable by future tooling.
    # Each rule is identified by a [bracketed-key] prefix.
    - Use SHALL for mandatory requirements (testable)
    - Scenarios use WHEN/THEN/AND format only
    - Ensure scenarios are concrete with specific inputs and expected outputs
    - Include both positive and negative scenarios
    - Requirements grouped logically with clear purpose statements
    - |
      Format: `# Capability: <Title>` then `## Purpose` then `## Requirements`
      with `### Requirement:` and `#### Scenario:` headings.
    - "[bare-cross-refs] Cross-spec references SHALL use bare directory names (e.g., `cli-prune`), never line-anchored paths (e.g., `cli-prune/spec.md:35`)"
    - "[no-code-refs] Requirements and scenarios SHALL NOT reference implementation files via `path:N` form (e.g., `internal/foo.go:42`)"
    - "[purpose-coherence] `## Purpose` SHALL match the requirement surface; fix the Purpose (broaden) or fix the Requirement (delete or move)"
    # Layout pin (added; pulled from context block into rules for enforceability)
    - "All specs MUST live at openspec/specs/<category>-<spec-name>/spec.md (one folder deep; no files directly under openspec/specs/, no category subdirectories); see the Spec organization section in this file's context block for the category reference"
    # Purity rules (added)
    - "[scope-disclaimer] Requirements SHALL NOT include scope-disclaimer prose (e.g., 'this spec covers only X; Y is out of scope here'); reshape the requirement to match its actual ownership instead"
    - "[no-cross-spec-narrative] Requirements SHALL NOT include cross-spec narrative prose; a bare mention of the other spec's name is enough"
    - "[modified-full-text] MODIFIED Requirements MUST include the full updated requirement block (header + body + scenarios); partial updates lose detail at archive time"
    - "[purpose-min-length] When a delta introduces a NEW capability, its `## Purpose` MUST be at least 50 characters; archive copies it into the main spec it creates"

  design:
    - Include Context (current state, constraints, assumptions)
    - Goals state what will be achieved; Non-Goals state what is out of scope
    - Decisions are numbered with Choice, Rationale, Alternatives considered
    - Use SHALL/SHOULD for architectural constraints
    - Include Risks/Trade-offs section with specific mitigations
    - Reference related specs, proposals, or design decisions
    # Discipline (added)
    - Document constraints explicitly (technical, schedule, compatibility, security, etc.) under Context
    - Include Migration Plan (steps to deploy, rollback strategy if applicable); for source-only pre-1.0 changes, an explicit "no migration steps" line is acceptable
    - Include Open Questions (unknowns deferrable without changing specs, approach, or task breakdown); write "None." when none
    # Machine-readable (added)
    - "[decision-shape] Each numbered Decision MUST include Choice, Rationale, and Alternatives considered in that order"

  tasks:
    - "Group by layer: cmd, service, domain, infrastructure, test"
    - Use checkbox format for items
    - Tasks are small, clear, and independently verifiable
    - Tests written AFTER implementation to anchor code to specs
    - Include specific file paths and function/method names
    - "Add verification steps: mise run verify, lint, test, test:coverage, vuln:check"
    - Mark completed items with [x]
    - Tasks ordered logically with dependencies clear
    # Discipline (added)
    - Tasks MUST be grouped; tests and documentation MUST be co-located with the implementation task, not deferred to a final group (the late-cascade trap)
    - Use integer-N.M numbering (e.g., 2.1, 2.2, 2.3) — no letter-suffix ids (e.g., 2.0b); the apply phase parses checkbox format but readability suffers with mixed schemes
    # Machine-readable (added)
    - "[task-verify] Every checkbox MUST include a verification clause: 'verify by <cmd|test|observable|delivered:artifact>'; verification-only tasks only when they check integration behavior spanning multiple implementation tasks"
