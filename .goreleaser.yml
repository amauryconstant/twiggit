# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GitLab release config. Self-contained: identical build/archive/sbom/
# changelog blocks are also duplicated in .goreleaser.github.yml.
# Drift between the two is a known cost of the override-file pattern;
# v2.18.2 OSS has no `includes:` (Pro-only). Keep both files in sync.

project_name: twiggit
version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

snapshot:
  version_template: "{{ incpatch .Version }}-next"

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'

builds:
  - id: twiggit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X twiggit/internal/version.Version={{.Version}}
      - -X twiggit/internal/version.Commit={{.Commit}}
      - -X twiggit/internal/version.Date={{.Date}}
    main: ./main.go
    binary: twiggit
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE*
      - README.md
      - AGENTS.md

checksum:
  name_template: 'twiggit_{{.Version}}_checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_sbom.spdx.json"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - '^Merge pull request'
      - '^Merge branch'
  groups:
    - title: Features
      order: 0
    - title: Bug Fixes
      order: 100
    - title: Other
      order: 999

# Lock SCM inference to GitLab. Goreleaser OSS cannot cross-publish to
# GitHub (no `token_type` support; Pro-only); the GitHub release lives
# in .goreleaser.github.yml where the inferred SCM matches the target.
force_token: gitlab

release:
  gitlab:
    owner: amoconst
    name: twiggit
  mode: replace
  replace_existing_artifacts: false
  name_template: "v{{ .Version }}"

gomod:
  proxy: false
