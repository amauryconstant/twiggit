name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Build (or reuse) the self-owned release image. The reusable workflow
  # tags every build with :src-<hash> where <hash> is the content hash
  # of Dockerfile.release, so when Dockerfile.release is unchanged since
  # the last push the workflow reuses the existing image and returns its
  # digest. The release job then pulls by digest, eliminating the race
  # against any parallel image rebuild and the v0.16.x "manifest
  # unknown" cascade. See docs/release/AGENTS.md for the full invariant
  # and the per-surface architecture.
  build-image:
    uses: ./.github/workflows/release-image.yml

  release:
    needs: build-image
    runs-on: ubuntu-latest
    # Self-owned release image built by .github/workflows/release-image.yml
    # from Dockerfile.release. Bundles golang:1.27.2-alpine3.23 + git + bash +
    # goreleaser v2.18.2 + cosign v3.1.3 + syft v1.54.1. Bumping the goreleaser
    # base image is unavailable because goreleaser/goreleaser:v2.18.3 (and
    # v2.19.0 nightly) still pin to golang:1.27.1 which fails go.mod's Go
    # directive; see docs/release/AGENTS.md. GitLab CI releases do NOT use this
    # image — they stay on the runtime-installer pattern.
    container:
      image: ghcr.io/amauryconstant/twiggit/release@${{ needs.build-image.outputs.digest }}
      options: --entrypoint /bin/sh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag format guard
        run: |
          tag="${{ github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' must match vX.Y.Z (strict semver)"
            exit 1
          fi

      - name: Preflight (refuse to overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ github.ref_name }} already exists"
            exit 1
          fi

      - name: Allow git inside release container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Signing-mode fail-fast
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::cosign: OIDC keyless signing (GitHub Actions OIDC)"
          elif [ -n "${COSIGN_KEY:-}" ]; then
            echo "::notice::cosign: keyful signing via COSIGN_KEY"
          else
            echo "::error::cosign requires id-token: write or COSIGN_KEY env var"
            exit 1
          fi

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean -f .goreleaser.github.yml
