name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser:v2.18.2
      options: --entrypoint /bin/sh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag format guard
        run: |
          tag="${{ github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' must match vX.Y.Z (strict semver)"
            exit 1
          fi

      - name: Preflight (refuse to overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ github.ref_name }} already exists"
            exit 1
          fi

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean -f .goreleaser.github.yml

      - name: Sign SBOMs (OIDC keyless)
        run: |
          for sbom in dist/*_sbom.spdx.json; do
            [ -e "$sbom" ] || continue
            cosign sign --yes "$sbom"
          done
