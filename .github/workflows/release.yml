name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag format guard
        run: |
          tag="${{ github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' must match vX.Y.Z (strict semver)"
            exit 1
          fi

      - name: Preflight (refuse to overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ github.ref_name }} already exists"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.3'

      - name: Install syft
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          tar -xzf syft_1.52.0_linux_amd64.tar.gz syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f syft_1.52.0_linux_amd64.tar.gz
          syft version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean -f .goreleaser.github.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign SBOMs (OIDC keyless)
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          for sbom in dist/*_sbom.spdx.json; do
            [ -e "$sbom" ] || continue
            cosign sign --yes "$sbom"
          done
