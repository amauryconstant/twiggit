name: Release image

# Builds and pushes the self-owned release container consumed by
# .github/workflows/release.yml. The image is ghcr.io/amauryconstant/twiggit/release:latest.
# Source of truth is Dockerfile.release. Triggers on Dockerfile.release changes to
# main, on PRs touching the same path (build-only, no push), and on manual dispatch.

on:
  push:
    branches: [main]
    paths: ['Dockerfile.release']
  pull_request:
    paths: ['Dockerfile.release']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/amauryconstant/twiggit/release:latest
            ghcr.io/amauryconstant/twiggit/release:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
